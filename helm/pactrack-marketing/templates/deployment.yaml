apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pactrack-marketing.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pactrack-marketing.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "pactrack-marketing.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pactrack-marketing.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: marketing
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
{{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
{{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
