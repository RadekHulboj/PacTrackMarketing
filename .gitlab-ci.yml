###############################################################################
# GitLab CI/CD — PacTrack Marketing Landing Page
#
# Pipeline buduje Next.js landing page.
# Deployment na Kubernetes odbywa się ręcznie przez skrypt:
#   ./docker/k8s_build_and_load_marketing.sh
#
# Flow:
#   - branch main/develop → build (weryfikacja)
###############################################################################

stages:
  - build

variables:
  NODE_VERSION: "18"

# ---------------------------------------------------------------------------
# BUILD - Next.js
# ---------------------------------------------------------------------------
build:
  stage: build
  image: node:18-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .next/cache/
  script:
    - echo "==> Installing dependencies..."
    - npm ci
    - echo "==> Building Next.js app..."
    - npm run build
    - echo "==> Build completed successfully"
    - ls -la .next/
  artifacts:
    paths:
      - .next/
      - public/
      - package.json
      - next.config.mjs
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
